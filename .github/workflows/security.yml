name: Go Mod Vuln Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run a full scan regularly (e.g., every Monday at midnight)
    - cron: '0 0 * * MON'

jobs:
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Run go mod tidy
        run: go mod tidy

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        shell: bash

      - if: inputs.output-file == ''
        name: Run govulncheck
        run: govulncheck -C ${{ inputs.work-dir }} -format ${{ inputs.output-format }} ${{ inputs.go-package }}
        shell: bash
        
      - if: inputs.output-file != ''
        name: Run govulncheck and save to file
        run: govulncheck -C ${{ inputs.work-dir }} -format ${{ inputs.output-format }} ${{ inputs.go-package }} > ${{ inputs.output-file }}
        shell: bash

    permissions:
      contents: read
      # Required permission to upload code scanning results
      security-events: write 

